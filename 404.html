<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — Good Ways</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/fonts.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;font-family:'Onest',system-ui,sans-serif;background:#050B18;color:#EAF0FF;text-align:center;padding:40px 20px}
  .code{font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(96px,20vw,200px);line-height:1;letter-spacing:-.05em;background:linear-gradient(100deg,#6C9AFF,#7FD4FF);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-family:'Manrope',sans-serif;font-weight:700;font-size:clamp(20px,2.6vw,28px);letter-spacing:-.02em}
  p{color:#93A4C8;max-width:420px}
  .road{width:min(420px,80vw);height:3px;background:repeating-linear-gradient(90deg,#FFB23E 0 40px,transparent 40px 80px)}
  a{display:inline-block;margin-top:6px;padding:17px 30px;border-radius:60px;background:#2E6BFF;color:#fff;font-family:'Manrope',sans-serif;font-weight:700;text-decoration:none}
  a:focus-visible{outline:2px solid #FFB23E;outline-offset:4px}
</style>
</head>
<body>
  <div class="code">404</div>
  <div class="road" aria-hidden="true"></div>
  <h1>Такого маршрута нет</h1>
  <p>Страница не найдена или была перемещена. На главной — автопарк, направления и расчёт перевозки.</p>
  <a href="/">На главную</a>
</body>
</html>
